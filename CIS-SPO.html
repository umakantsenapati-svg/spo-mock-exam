<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>CIS – Sourcing & Procurement • 50 Questions • 30 min</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: white; min-height: 100vh; }
    .container { max-width: 900px; margin: 2rem auto; padding: 2rem; background: #1e293b; border-radius: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 1.5rem; }
    .timer { font-size: 1.5rem; font-weight: bold; text-align: center; margin-bottom: 1.5rem; color: #fbbf24; }
    .time-warning { color: #ef4444; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0.4; } }
    .question { margin: 2rem 0; padding: 1.5rem; background: #334155; border-radius: 0.75rem; border-left: 6px solid #38bdf8; }
    .options label { display: block; margin: 0.75rem 0; padding: 0.75rem; background: #475569; border-radius: 0.5rem; cursor: pointer; transition: all 0.2s; }
    .options label:hover { background: #64748b; }
    .feedback { margin-top: 1.5rem; padding: 1rem; border-radius: 0.5rem; font-weight: 600; }
    .correct { background: #166534; color: #86efac; }
    .incorrect { background: #7f1d1d; color: #fca5a5; }
    button { padding: 1rem 2rem; font-size: 1.2rem; background: #38bdf8; color: white; border: none; border-radius: 0.5rem; cursor: pointer; margin: 1rem auto; display: block; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #final { margin-top: 3rem; text-align: center; font-size: 1.4rem; }
  </style>
</head>

let currentQuestion = 0;
let score = 0;
let timerInterval;
let timeLeft = 30 * 60; // 30 minutes in seconds
let answered = new Array(questions.length).fill(false);

function startExam() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('exam').classList.remove('hidden');
  startTimer();
  showQuestion();
}

function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    const min = Math.floor(timeLeft / 60);
    const sec = timeLeft % 60;
    document.getElementById('timer').textContent = `${min}:${sec.toString().padStart(2, '0')}`;
    if (timeLeft <= 300) document.getElementById('timer').classList.add('time-warning');
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      endExam();
    }
  }, 1000);
}

function showQuestion() {
  const q = questions[currentQuestion];
  const container = document.getElementById('questionContainer');
  container.innerHTML = `
    <div class="question">
      <h3>Question ${currentQuestion + 1} of ${questions.length}</h3>
      <p>${q.q}</p>
      <div class="options">
        ${q.options.map((opt, i) => `
          <label>
            <input type="radio" name="q${currentQuestion}" value="${String.fromCharCode(65 + i)}" onchange="selectAnswer('${String.fromCharCode(65 + i)}')">
            ${opt}
          </label>
        `).join('')}
      </div>
      <div id="feedback${currentQuestion}" class="feedback hidden"></div>
    </div>
  `;
  document.getElementById('nextBtn').disabled = true;
}

function selectAnswer(letter) {
  document.getElementById('nextBtn').disabled = false;
  const q = questions[currentQuestion];
  const feedbackDiv = document.getElementById(`feedback${currentQuestion}`);
  const isCorrect = letter === q.a;

  feedbackDiv.classList.remove('hidden');
  if (isCorrect) {
    feedbackDiv.className = 'feedback correct';
    feedbackDiv.innerHTML = '<i class="fa-solid fa-check-circle"></i> Correct!<br><small>' + q.exp + '</small>';
    score++;
  } else {
    feedbackDiv.className = 'feedback incorrect';
    feedbackDiv.innerHTML = `<i class="fa-solid fa-times-circle"></i> Incorrect.<br>Correct answer: ${q.a}<br><small>${q.exp}</small>`;
  }

  answered[currentQuestion] = true;
}

function nextQuestion() {
  currentQuestion++;
  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    endExam();
  }
}

function endExam() {
  clearInterval(timerInterval);
  document.getElementById('exam').classList.add('hidden');
  const percentage = Math.round((score / questions.length) * 100);
  document.getElementById('final').innerHTML = `
    <h2 class="text-4xl font-bold ${percentage >= 75 ? 'text-green-400' : 'text-red-400'}">
      ${score} / ${questions.length} (${percentage}%)
    </h2>
    <p class="text-xl mt-4">${percentage >= 75 ? 'Strong – likely pass territory' : 'Needs more review – focus on weak areas'}</p>
    <button onclick="location.reload()" class="mt-6 bg-blue-600 hover:bg-blue-700 px-8 py-4 rounded-lg text-xl">
      Restart Exam
    </button>
  `;
  document.getElementById('final').classList.remove('hidden');
}
</script>
